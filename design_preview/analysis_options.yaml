analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    dead_code: error
    missing_required_param: error
  exclude:
    - build/**
linter:
  rules:
    - avoid_print
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_final_fields
    - use_key_in_widget_constructors
    - unnecessary_lambdas
