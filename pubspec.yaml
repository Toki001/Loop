name: loop
description: A local-first deliberate practice journal for iOS and Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  path_provider: ^2.1.6
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/MaterialIcons_LICENSE.txt
