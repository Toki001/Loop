name: loop
description: A local-first deliberate practice journal for iOS and Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  drift: ^2.35.3
  sqlite3: ^3.8.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  characters: ^1.4.1
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/MaterialIcons_LICENSE.txt
