analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - tmp/**
linter:
  rules:
    - avoid_print
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_final_fields
    - use_key_in_widget_constructors
    - unnecessary_lambdas
